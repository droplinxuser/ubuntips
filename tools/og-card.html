<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #0d1117; }
  body { min-height: 100vh; display: grid; place-items: center; }
  #card {
    position: relative;
    width: 1200px;
    height: 630px;
    padding: 56px 64px;
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  #card::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(600px 320px at 88% 6%, rgba(31, 111, 235, 0.28), transparent 70%),
      radial-gradient(520px 300px at 8% 96%, rgba(35, 134, 54, 0.20), transparent 70%);
    pointer-events: none;
  }
  .top { position: relative; display: flex; align-items: center; gap: 16px; }
  .mark {
    display: grid;
    place-items: center;
    width: 56px;
    height: 56px;
    border: 1px solid #30363d;
    border-radius: 12px;
    background: #161b22;
    color: #3fb950;
  }
  .brand { font-size: 26px; font-weight: 600; letter-spacing: -0.01em; }
  .brand span { color: #8d96a0; font-weight: 400; }
  .mid { position: relative; }
  h1 {
    font-size: 76px;
    line-height: 1.02;
    letter-spacing: -0.035em;
    font-weight: 700;
    margin-bottom: 22px;
  }
  h1 em { font-style: normal; color: #3fb950; }
  p.lede {
    font-size: 27px;
    line-height: 1.4;
    color: #8d96a0;
    max-width: 900px;
  }
  .bottom { position: relative; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .label {
    font-size: 20px;
    line-height: 36px;
    padding: 0 18px;
    color: #4493f8;
    background: rgba(56, 139, 253, 0.15);
    border: 1px solid rgba(56, 139, 253, 0.4);
    border-radius: 2em;
  }
  .label.green { color: #3fb950; background: rgba(46, 160, 67, 0.15); border-color: rgba(46, 160, 67, 0.4); }
  .url { margin-left: auto; font-size: 22px; color: #6e7681; }
</style>
</head>
<body>
<div id="card">
  <div class="top">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 16 16" fill="currentColor"><path d="M0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 14.25 15H1.75A1.75 1.75 0 0 1 0 13.25Zm1.75-.25a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25V2.75a.25.25 0 0 0-.25-.25Zm7.25 8a.75.75 0 0 1 .75-.75h2a.75.75 0 0 1 0 1.5h-2a.75.75 0 0 1-.75-.75ZM3.72 4.72a.75.75 0 0 1 1.06 0l3 3a.75.75 0 0 1 0 1.06l-3 3a.75.75 0 1 1-1.06-1.06L6.19 8 3.72 5.53a.75.75 0 0 1 0-1.06Z"/></svg>
    </div>
    <div class="brand">ubuntips<span>.com</span></div>
  </div>

  <div class="mid">
    <h1>Practical notes on<br><em>Ubuntu servers</em></h1>
    <p class="lede">Provisioning, tuning and hardening a full web stack — without the patch treadmill.</p>
  </div>

  <div class="bottom">
    <span class="label">Ubuntu</span>
    <span class="label">Angie</span>
    <span class="label">PHP-FPM</span>
    <span class="label">MariaDB</span>
    <span class="label green">static · no database</span>
    <span class="url">ubuntips.com</span>
  </div>
</div>
</body>
</html>
