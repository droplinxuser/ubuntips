baseURL = "https://ubuntips.com/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Ubuntu Tips"
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  description = "Practical notes on provisioning, tuning and hardening Ubuntu servers."
  author = "Draft"
  repo = "https://github.com/droplinxuser/ubuntips"
  ogImage = "/img/og-default.png"
  ogImageAlt = "ubuntips.com — practical notes on Ubuntu servers"
  themeColorLight = "#ffffff"
  themeColorDark = "#0d1117"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false

[markup.goldmark.renderer]
  unsafe = false

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
