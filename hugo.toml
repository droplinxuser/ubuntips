baseURL = "https://ubuntips.com/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Ubuntu Tips"
enableRobotsTXT = true
enableGitInfo = false

[pagination]
  pagerSize = 10

[params]
  description = "Practical notes on provisioning, tuning and hardening Ubuntu servers."
  author = "droplinxuser"
  repo = "https://github.com/droplinxuser/ubuntips"
  ogImage = "/img/og-default.png"
  ogImageAlt = "ubuntips.com — practical notes on Ubuntu servers"

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false

[markup.goldmark.renderer]
  unsafe = false

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 10
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]
